apply plugin: 'com.android.application'

def getLatestGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "org.cmucreatelab.android.flutterprek"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 26
        versionName "2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace 'org.cmucreatelab.android.flutterprek'

    applicationVariants.all { variant ->
        def versionName
        if (variant.buildType.isDebuggable()) {
            versionName = "dev-" + getLatestGitHash()
        } else {
            versionName = "v" + variant.versionName
        }
        variant.resValue "string", "versionName", versionName
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX equivalents of support libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.google.code.gson:gson:2.8.5'
    implementation(name:'circularimageview', ext:'aar', version:'3.2.0')

    // Room components (AndroidX)
    implementation "androidx.room:room-runtime:2.6.1"
    implementation 'androidx.activity:activity:1.8.0'
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    androidTestImplementation "androidx.room:room-testing:2.6.1"

    // Lifecycle components (AndroidX)
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.2.0"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.github.tasota:android-camera-and-image-select:2.0.2'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.bio-matic:segmentedarcview:1.1.3'


}
